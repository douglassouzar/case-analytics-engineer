version: 2

models:
  - name: int_sessions
    description: "Sessões deduplicadas por session_id, mantendo a mais recente e com sessões de bot excluídas."
    tests:
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: ended_at
            column_B: started_at
            or_equal: false
            row_condition: "ended_at is not null"
          config:
            severity: warn

  - name: int_bookings
    description: "Reservas deduplicadas por booking_id (mantendo a mais recente), restritas a parceiros ativos, e com total_amount > 0 exigido apenas para reservas confirmed/completed."
    tests:
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: dropoff_date
            column_B: pickup_date
            or_equal: false
            row_condition: "dropoff_date is not null"
          config:
            severity: warn

  - name: int_cancellations
    description: "Cancelamentos deduplicados por cancellation_id, mantendo o mais recente, restritos a reservas existentes em stg_bookings, e com refund_amount filtrado para nunca exceder o total_amount da reserva associada"

  - name: int_searches
    description: "Buscas deduplicadas por search_id (mantendo a mais recente por searched_at), restritas a sessões válidas, deduplicadas e não-bot."
    columns:
      - name: search_id
        description: "Identificador único da busca."
        tests: [not_null, unique]
      - name: session_id
        description: "Sessão em que a busca foi realizada."
        tests: [not_null]
      - name: partner_id_clicked
        description: "Parceiro cujo resultado o usuário clicou nesta busca, quando houve clique (35% nulo)."
        tests:
          - relationships:
              arguments:
                to: ref('int_partners')
                field: partner_id
              config:
                severity: warn
    tests:
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: dropoff_date
            column_B: pickup_date
            or_equal: true
            row_condition: "dropoff_date is not null"
          config:
            severity: warn

  - name: int_partners
    description: "Parceiros deduplicados por partner_id, mantendo o mais recente por updated_at, com fallback para created_at."
    columns:
      - name: partner_id
        description: "Identificador único do parceiro."
        tests: [not_null, unique]
