
contract:
  id: rpt_revenue_by_partner
  version: 2.0.0
  status: active
  description: >
    Receita por parceiro, aberta por moeda, para uso em revisão de comissão
    (Revenue/Pricing e Financeiro). Não produz, nesta fase, um número
    consolidado único para o board — ver metric_catalog e backlog_conhecido.
    Consome fct_bookings e int_cancellations, produzidos no D1.

  owner:
    team: Analytics Engineering
    contact: douglassouza.admtec@gmail.com
    role: Data Producer

  consumers:
    - team: Revenue & Pricing
      stakeholder: Head de Revenue & Pricing
      uso: "Detalhe por parceiro/moeda para revisão de comissão"
      criticidade: alta
      nota: "Número usado para decisão que afeta pagamento de comissão a parceiro externo"
    - team: Financeiro
      uso: "Conciliação com o valor já reportado no faturamento"
      criticidade: alta
    - team: Comercial / Board
      uso: "Recebe, nesta fase, a mesma visão aberta por moeda de Pricing/Financeiro — sem consolidado único"
      criticidade: media
      nota: "Um número único de receita total para o board só existirá após RF-05 (tabela de câmbio oficial). Não há previsão de data — comunicar essa limitação antes da primeira apresentação ao board"

# -----------------------------------------------------------------------------
# Fontes upstream (dependências deste contrato)
# -----------------------------------------------------------------------------
upstream_dependencies:
  - model: fct_bookings
    fields_used: [booking_id, partner_id, total_amount, currency, status, booked_at]
    contrato_upstream: "Grão 1 linha por booking_id, já filtrado (parceiro ativo, total_amount > 0 quando confirmed/completed). Ver models/marts/schema.yml"
  - model: int_cancellations
    fields_used: [booking_id]
    contrato_upstream: "Usado para excluir da receita qualquer reserva com cancelamento registrado, mesmo que fct_bookings ainda não reflita o status atualizado"
  - model: dim_partners
    fields_used: [partner_id, partner_name, tier]
    contrato_upstream: "Enriquecimento de nome e tier comercial do parceiro"

# -----------------------------------------------------------------------------
# Schema do dado entregue
# -----------------------------------------------------------------------------
schema:
  - field: partner_id
    type: string
    nullable: false
    description: "Identificador do parceiro (PRTxxxx)."
    pii: false

  - field: partner_name
    type: string
    nullable: false
    description: "Nome comercial do parceiro, de dim_partners."
    pii: false

  - field: reference_month
    type: date
    nullable: false
    description: "Mês de referência do relatório (primeiro dia do mês)."
    pii: false

  - field: currency
    type: string
    nullable: false
    description: "Moeda ISO 4217 da receita reportada nesta linha (BRL, USD, ARS, CLP, COP)."
    pii: false

  - field: revenue_amount
    type: decimal
    nullable: false
    description: >
      Soma de total_amount de fct_bookings para este parceiro/moeda/mês,
      status confirmed ou completed, excluindo booking_id presente em
      int_cancellations. NUNCA somado entre valores de currency diferentes,
      ver regra de negócio "no_cross_currency_sum" abaixo.
    pii: false

  - field: booking_count
    type: integer
    nullable: false
    description: "Quantidade de reservas que compõem revenue_amount, mesmo filtro."
    pii: false

  - field: excluded_invalid_amount_count
    type: integer
    nullable: false
    description: >
      Quantidade de reservas confirmed/completed do parceiro/mês excluídas do
      cálculo por total_amount nulo, zero ou negativo. Alimenta o alerta de
      completude (ver quality_checks.revenue_completeness).
    pii: false

  - field: flagged_suspicious_booking_count
    type: integer
    nullable: false
    description: >
      Quantidade de reservas do parceiro/mês envolvidas em padrão de múltiplas
      reservas do mesmo usuário no mesmo dia (teste_reservas_duplicadas_usuario_dia).
      Informativo, não é descontado de revenue_amount.
    pii: false

  - field: is_partial_month
    type: boolean
    nullable: false
    description: >
      true quando reference_month é o mês corrente ainda não fechado.
      Consumidor deve tratar como número sujeito a alteração até o fechamento.
    pii: false

# -----------------------------------------------------------------------------
# Catálogo de métricas (mini data contract por métrica, formato exigido pelo
# Desafio 5: nome, definição de negócio, lógica de cálculo, owner, SLA,
# criticidade)
# -----------------------------------------------------------------------------
metric_catalog:

  - nome: "Receita Confirmada por Parceiro"
    definicao_negocio: >
      Valor gerado por um parceiro que efetivamente vai contar para o cálculo
      de comissão — reserva que "pegou", não pendente e não cancelada.
    logica_de_calculo: >
      SUM(total_amount) de fct_bookings, WHERE status IN ('confirmed','completed')
      AND booking_id NOT IN (SELECT booking_id FROM int_cancellations),
      agrupado por partner_id, currency e reference_month. Nunca somado entre
      valores de currency diferentes (ver business_rules.no_cross_currency_sum).
    owner:
      dado: "Analytics Engineering"
      negocio: "Head de Revenue & Pricing"
    sla: "Fechado: disponível em até 2 dias úteis após o fechamento do mês. Parcial: atualizado a cada rodada incremental de fct_bookings (meta 24h)."
    criticidade: alta
    observacao: "Base de cálculo de comissão paga a parceiro externo — erro aqui tem custo financeiro real, não só reputacional."

  - nome: "Receita Consolidada (Board)"
    definicao_negocio: >
      Um único número de receita total, em BRL, que o diretor comercial possa
      apresentar numa reunião de board sem precisar interpretar 5 colunas de moeda.
    logica_de_calculo: >
      NÃO IMPLEMENTADA nesta fase. Depende de RF-05 (tabela de câmbio oficial,
      cotação diária do Banco Central do Brasil). A alternativa de um número
      aproximado com taxa fixa e aviso de aproximação foi avaliada e descartada
      na entrevista de discovery — decisão da stakeholder foi não apresentar
      nenhum número provisório.
    owner:
      dado: "Analytics Engineering (a definir formalmente quando RF-05 entrar em backlog priorizado)"
      negocio: "Head de Revenue & Pricing / Diretor Comercial"
    sla: "Não definido — RF-05 não tem prazo, depende de outro time (engenharia de dados)"
    criticidade: media
    observacao: "Métrica inexistente hoje. Registrada aqui para que ninguém no board assuma que esse número já existe."

  - nome: "Índice de Completude de Receita"
    definicao_negocio: >
      Proporção de reservas confirmadas/concluídas que NÃO puderam entrar no
      cálculo de receita por terem valor inválido (nulo, zero ou negativo) na origem.
      Serve como termômetro de confiança do número de receita do mês.
    logica_de_calculo: >
      excluded_invalid_amount_count / (booking_count + excluded_invalid_amount_count),
      por partner_id e reference_month.
    owner:
      dado: "Analytics Engineering"
      negocio: "Head de Revenue & Pricing (consumidora do alerta)"
    sla: "Calculado a cada rodada do relatório, mesma cadência de Receita Confirmada por Parceiro"
    criticidade: alta
    observacao: "Alerta automático se > 2% no mês — ver quality_checks.revenue_completeness."

  - nome: "Reservas Suspeitas (Mesmo Usuário/Dia)"
    definicao_negocio: >
      Sinal de possível fraude ou abuso: mais de uma reserva do mesmo usuário
      no mesmo dia. Não é removido da receita automaticamente — é alerta para
      revisão humana antes de qualquer ação sobre comissão.
    logica_de_calculo: >
      Contagem de booking_id por (user_id, DATE(booked_at)) com COUNT > 1,
      restrito a reservas confirmed/completed, via teste_reservas_duplicadas_usuario_dia.
    owner:
      dado: "Analytics Engineering"
      negocio: "Head de Revenue & Pricing (decide se há ação sobre comissão)"
    sla: "Calculado a cada rodada do relatório"
    criticidade: media
    observacao: "Alerta automático se > 0.5% dos usuários com reserva no período — ver quality_checks.suspicious_booking_rate."

# -----------------------------------------------------------------------------
# Regras de negócio (rastreáveis à entrevista / governance.md)
# -----------------------------------------------------------------------------
business_rules:
  - id: revenue_definition
    rule: "status in ('confirmed','completed') AND booking_id NOT IN int_cancellations"
    source: "governance.md, seção 7.2 — confirmado sem alteração na entrevista com Revenue/Pricing"

  - id: no_cross_currency_sum
    rule: "revenue_amount nunca é somado entre linhas de currency diferentes"
    reason: "Dataset não possui tabela de câmbio; soma entre moedas produz valor sem validade financeira e afeta cálculo de comissão"
    source: "roteiro_entrevista.md, Parte 3"

  - id: no_board_only_approximation
    rule: "Nenhum valor aproximado/provisório de receita é produzido para o board nesta fase"
    reason: >
      Avaliado na entrevista e descartado pela stakeholder — prioridade foi dada
      à solução definitiva (RF-05) em vez de um número aproximado com aviso,
      mesmo sem prazo definido para essa solução
    source: "roteiro_entrevista.md, Parte 3 (versão atualizada em 10/09/2026)"

  - id: no_automatic_exclusion_of_suspicious_bookings
    rule: "flagged_suspicious_booking_count é informativo; nenhuma reserva é removida de revenue_amount automaticamente por esse motivo"
    reason: "Suspeita de fraude exige revisão humana antes de qualquer ação sobre receita/comissão"
    source: "roteiro_entrevista.md, Parte 4; governance.md, seção 3"

# -----------------------------------------------------------------------------
# SLA
# -----------------------------------------------------------------------------
sla:
  freshness:
    partial_view: "Atualizado na mesma cadência do incremental de fct_bookings (ver governance.md 8.1, meta de rodar a cada 24h)"
    closed_month_view: "Disponível em até 2 dias úteis após o fechamento do mês"
  availability_target: "99% dos meses sem atraso no fechamento oficial"

# -----------------------------------------------------------------------------
# Regras de qualidade / alertas (thresholds herdados de governance.md seção 8.4,
# aplicados aqui no nível do relatório)
# -----------------------------------------------------------------------------
quality_checks:
  - id: revenue_completeness
    check: "excluded_invalid_amount_count / (booking_count + excluded_invalid_amount_count) por parceiro/mês"
    threshold: "alerta se > 2%"
    action_on_breach: "Destacar no relatório como anomalia a investigar antes de publicar o número oficial do mês"

  - id: suspicious_booking_rate
    check: "flagged_suspicious_booking_count / total de usuários com reserva no período"
    threshold: "alerta se > 0.5%"
    action_on_breach: "Notificar Revenue/Pricing separadamente da publicação do número de receita"

  - id: currency_domain_check
    check: "currency deve estar em (BRL, USD, ARS, CLP, COP)"
    threshold: "qualquer valor fora do domínio bloqueia a publicação (severity: error)"
    action_on_breach: "Pipeline falha, não publica relatório com moeda desconhecida sem revisão manual"

# -----------------------------------------------------------------------------
# Backlog conhecido — fora deste contrato, ver requisitos_tecnicos.md seção 4
# -----------------------------------------------------------------------------
backlog_conhecido:
  - id: RF-05
    item: "Conversão cambial oficial (cotação histórica do Banco Central do Brasil) + consolidado único para o board"
    impacto_no_contrato: "Adicionaria de volta um campo de receita consolidada em BRL ao schema e ao metric_catalog, agora com taxa de mercado real em vez de aproximação — sem prazo definido, depende de outro time"
  - id: net_refund_revenue
    item: "Receita líquida de reembolso parcial (hoje total_amount é bruto)"
    impacto_no_contrato: "Adicionaria campo revenue_amount_net_of_refund ao schema e ao metric_catalog"

# -----------------------------------------------------------------------------
# Changelog
# -----------------------------------------------------------------------------
changelog:
  - version: 1.0.0
    date: "2026-09-09"
    change: "Versão inicial, resultado da entrevista de discovery com Revenue/Pricing (D5)"
  - version: 2.0.0
    date: "2026-09-10"
    change: >
      Revisão final antes da entrega. Removido o campo de consolidado
      aproximado para o board (board_consolidated_brl_amount / is_approximate)
      — descartado na negociação final da entrevista. Adicionado metric_catalog
      com o mini data contract por métrica (nome, definição, lógica de cálculo,
      owner, SLA, criticidade), atendendo ao requisito literal do Desafio 5.
